<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Real-Timer Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.js"></script>

</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Real-Timer Chat Application</h1>
        <div id="chat"
             class="border rounded p-3 mb-3"
             style="height: 300px; overflow-y: auto;">
        </div>

        <div class="input-group mb-3">
            <input type="text"  id="senderInput" class="form-control"
                placeholder="Your name...">
        </div>

        <div class="input-group mb-3">
            <input type="text"  id="messageInput" class="form-control"
                   placeholder="Type a mensage...">

            <div id="input-group-append">
                <button id="sendMessage" type="button" class="btn btn-primary">Send</button>
            </div>
        </div>

    </div>
</body>
<script>
    var stompClient = null;

 function setConnected(connected){
     document.getElementById('sendMessage').disabled = !connected;
 }

 function connect(){

     var socket = new SockJS('/chat');

     stompClient = StompJs.Stomp.over(socket);
     stompClient.connect({}, function (frame) {
         console.log('Connected: ' + frame);
         setConnected(true);

         stompClient.subscribe('/topic/messages', function (message) {

             showMessage(JSON.parse(message.body));
         });
     }, function(error) {
          console.error('STOMP Error:', error);
          setConnected(false);
     });
 }


 function showMessage(message) {
     var chat = document.getElementById('chat');
     var messageElement = document.createElement('div');
     messageElement.textContent = message.sender + ' : ' + message.content;
     messageElement.class = "border-bottom mb-1";
     chat.appendChild(messageElement);
     chat.scrollTop = chat.scrollHeight;
 }

 function sendMessage() {
     var sender = document.getElementById('senderInput').value;
     var content = document.getElementById('messageInput').value;
     if (!sender || !content) {
         alert('Please enter your name and a message.');
         return;
     }
     var chatMessage = {
         sender: sender,
         content: content
     };

     if (stompClient && stompClient.connected) {
         stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
         document.getElementById('messageInput').value = '';
     } else {
          console.error("Not connected to STOMP server.");
     }
 }
 document.getElementById('sendMessage').addEventListener('click', sendMessage);
 window.onload = connect;

</script>
</html>
